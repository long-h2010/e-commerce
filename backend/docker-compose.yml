version: "3.8"
services:
  postgresdb:
    image: 'postgres:15'
    container_name: 'postgres'
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=e-commerce
    ports:
      - '5432:5432'
    volumes:
      - ./tmp/postgres/data:/var/lib/postgresql/data
    networks:
      - network
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - network
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s

  api:
    image: 'e-commerce-api'
    container_name: 'api'
    build:
      context: .
    restart: always
    volumes:
      - ./migrations:/app/migrations:z
      - ./migrations/versions:/app/migrations/versions:z
    ports:
      - '8000:8000'
    networks:
      - network
      - default
    depends_on:
      postgresdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env

volumes:
  redis_data:

networks:
  network:
    driver: bridge
